<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scoreboard - StudySpark</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#d7dae0",
                    "surface-container": "#ebeef4",
                    "on-tertiary-fixed-variant": "#6b3b00",
                    "tertiary": "#894d00",
                    "background": "#f7f9ff",
                    "surface-variant": "#dfe3e8",
                    "on-primary-fixed": "#001d31",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "secondary-container": "#e0e3e5",
                    "secondary": "#5c5f61",
                    "secondary-fixed": "#e0e3e5",
                    "on-secondary-fixed": "#191c1e",
                    "secondary-fixed-dim": "#c4c7c9",
                    "primary-container": "#007bb9",
                    "on-surface": "#181c20",
                    "inverse-surface": "#2d3135",
                    "surface": "#f7f9ff",
                    "surface-tint": "#006398",
                    "on-tertiary-fixed": "#2d1600",
                    "outline": "#707881",
                    "primary-fixed": "#cce5ff",
                    "outline-variant": "#bfc7d2",
                    "on-secondary-container": "#626567",
                    "on-secondary-fixed-variant": "#444749",
                    "on-surface-variant": "#3f4850",
                    "primary": "#006194",
                    "error": "#ba1a1a",
                    "inverse-on-surface": "#eef1f7",
                    "on-primary": "#ffffff",
                    "tertiary-fixed": "#ffdcc0",
                    "tertiary-fixed-dim": "#ffb875",
                    "on-primary-container": "#fdfcff",
                    "surface-container-highest": "#dfe3e8",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "on-primary-fixed-variant": "#004b73",
                    "primary-fixed-dim": "#93ccff",
                    "on-background": "#181c20",
                    "tertiary-container": "#ac6200",
                    "surface-container-high": "#e5e8ee",
                    "inverse-primary": "#93ccff",
                    "surface-container-low": "#f1f4fa",
                    "on-error": "#ffffff",
                    "surface-bright": "#f7f9ff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#fffbff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "stack-sm": "8px",
                    "section-gap": "48px",
                    "container-padding-desktop": "40px",
                    "container-padding-mobile": "16px",
                    "unit": "4px",
                    "stack-lg": "24px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "title-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "caption": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                    "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                    "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                    "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                    "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
            }
          }
        }
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom animations for celebratory feel */
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Donut Chart Animation */
        .chart-progress {
            transition: stroke-dashoffset 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop relative overflow-x-hidden">
<!-- Atmospheric Background Effects -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-fixed-dim rounded-full blur-[120px] opacity-30 z-0 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-fixed-dim rounded-full blur-[120px] opacity-20 z-0 pointer-events-none"></div>
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden" id="confetti-container"></div>
<!-- Main Content Canvas (Navigation Suppressed for Success Screen) -->
<main class="w-full max-w-[720px] z-10 flex flex-col items-center">
<!-- Header Banner -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgba(2,132,199,0.08)] p-stack-lg md:p-section-gap flex flex-col items-center text-center mb-section-gap w-full animate-fade-in-up border border-outline-variant/20">
<div class="w-20 h-20 rounded-full bg-tertiary-fixed flex items-center justify-center mb-stack-md relative shadow-sm">
<!-- Decorative glow behind icon -->
<div class="absolute inset-0 bg-tertiary-fixed rounded-full blur-md opacity-50"></div>
<span class="material-symbols-outlined text-tertiary text-[40px] relative z-10" data-icon="emoji_events" data-weight="fill" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-sm tracking-tight">
                Keren Banget! Kamu Siap Ujian!
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">
                Dedikasi belajarmu membuahkan hasil. Terus pertahankan momentum ini.
            </p>
</div>
<!-- Centerpiece: Donut Chart -->
<div class="relative w-64 h-64 md:w-80 md:h-80 mb-section-gap flex items-center justify-center animate-fade-in-up delay-100">
<!-- Decorative dashed outer ring -->
<svg class="absolute inset-[-16px] w-[calc(100%+32px)] h-[calc(100%+32px)] animate-spin-slow" style="animation: spin 60s linear infinite; @keyframes spin { 100% { transform: rotate(360deg); } }" viewbox="0 0 100 100">
<circle class="text-outline-variant/30" cx="50" cy="50" fill="transparent" r="48" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1"></circle>
</svg>
<svg class="w-full h-full transform -rotate-90 filter drop-shadow-md" viewbox="0 0 100 100">
<!-- Track -->
<circle class="text-surface-container-high" cx="50" cy="50" fill="transparent" r="40" stroke="currentColor" stroke-width="12"></circle>
<!-- Fill (80% of 251.2 circumference = ~201, offset = 50.2) -->
<!-- stroke-linecap="round" adds soft geometry -->
<circle class="text-primary chart-progress" cx="50" cy="50" fill="transparent" id="donut-fill" r="40" stroke="currentColor" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="font-display-lg text-display-lg text-primary" id="score-text">0%</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-[0.1em] mt-1">Success Rate</span>
</div>
</div>
<!-- Secondary Stats Grid (Bento Style) -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-stack-md w-full mb-section-gap animate-fade-in-up delay-200">
<div class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex flex-col items-center text-center border border-outline-variant/20 hover:shadow-[0_8px_30px_rgba(2,132,199,0.08)] transition-shadow">
<span class="material-symbols-outlined text-primary mb-2" data-icon="check_circle">check_circle</span>
<span class="font-title-md text-title-md text-on-surface">24</span>
<span class="font-caption text-caption text-on-surface-variant">Benar</span>
</div>
<div class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex flex-col items-center text-center border border-outline-variant/20 hover:shadow-[0_8px_30px_rgba(2,132,199,0.08)] transition-shadow">
<span class="material-symbols-outlined text-error mb-2" data-icon="cancel">cancel</span>
<span class="font-title-md text-title-md text-on-surface">6</span>
<span class="font-caption text-caption text-on-surface-variant">Salah</span>
</div>
<div class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex flex-col items-center text-center border border-outline-variant/20 hover:shadow-[0_8px_30px_rgba(2,132,199,0.08)] transition-shadow">
<span class="material-symbols-outlined text-secondary mb-2" data-icon="timer">timer</span>
<span class="font-title-md text-title-md text-on-surface">12m</span>
<span class="font-caption text-caption text-on-surface-variant">Waktu</span>
</div>
<div class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex flex-col items-center text-center border border-tertiary-fixed hover:shadow-[0_8px_30px_rgba(2,132,199,0.08)] transition-shadow bg-gradient-to-b from-surface-container-lowest to-tertiary-fixed/10">
<span class="material-symbols-outlined text-tertiary mb-2" data-icon="bolt">bolt</span>
<span class="font-title-md text-title-md text-tertiary">+150</span>
<span class="font-caption text-caption text-tertiary">XP Diperoleh</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-stack-md w-full md:w-3/4 animate-fade-in-up delay-300">
<button class="flex-1 h-14 rounded-xl border-[2px] border-primary text-primary font-label-md text-label-md hover:bg-primary-container/20 hover:shadow-[0_4px_12px_rgba(2,132,199,0.1)] transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                Coba Lagi
            </button>
<button class="flex-1 h-14 rounded-xl bg-primary text-on-primary font-label-md text-label-md hover:bg-surface-tint hover:shadow-[0_8px_24px_rgba(2,132,199,0.25)] transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                Kembali ke Dashboard
            </button>
</div>
</main>
<script>
        document.addEventListener("DOMContentLoaded", () => {
            // Animate Donut Chart to 80%
            setTimeout(() => {
                const fill = document.getElementById('donut-fill');
                const scoreText = document.getElementById('score-text');
                const targetScore = 80;
                
                // Circumference is ~251.2. Offset for 80% is 251.2 * (1 - 0.80) = 50.24
                fill.style.strokeDashoffset = '50.24';

                // Count up animation for text
                let currentScore = 0;
                const duration = 1500; // ms
                const interval = 20; // ms
                const step = targetScore / (duration / interval);

                const counter = setInterval(() => {
                    currentScore += step;
                    if (currentScore >= targetScore) {
                        currentScore = targetScore;
                        clearInterval(counter);
                    }
                    scoreText.innerText = Math.round(currentScore) + '%';
                }, interval);

            }, 400); // Slight delay to wait for page load

            // Generate subtle confetti effect
            const colors = ['#006194', '#93ccff', '#ffb875', '#ac6200', '#eef1f7'];
            const container = document.getElementById('confetti-container');
            
            // Only generate confetti on larger screens to avoid mobile clutter
            if (window.innerWidth > 640) {
                for(let i=0; i<40; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('absolute', 'w-2', 'h-2', 'rounded-sm', 'opacity-60');
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = -20 + 'px';
                    
                    // Add slight rotation variant
                    if (Math.random() > 0.5) confetti.classList.add('rounded-full');
                    
                    const duration = Math.random() * 4 + 3;
                    const delay = Math.random() * 2;
                    
                    confetti.style.animation = `fall ${duration}s linear ${delay}s infinite`;
                    container.appendChild(confetti);
                }
            }
        });
    </script>
</body></html>
